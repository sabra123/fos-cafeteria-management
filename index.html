<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOS | Cafeteria Management</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#1b2940;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #94b9ff}a{color:inherit}.shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}.side{background:#10213b;color:#d5e1f4;padding:27px 17px;display:flex;flex-direction:column;gap:10px}.brand{font-weight:850;font-size:25px;color:#fff;margin-bottom:8px}.brand small{display:block;color:#8fa7ca;font-weight:500;font-size:12px;letter-spacing:2px;margin-top:5px}.nav{border:0;background:transparent;color:#c6d4eb;text-align:left;border-radius:12px;padding:14px;font-weight:650;width:100%}.nav.active,.nav:hover{background:#263e62;color:white}.foot{margin-top:auto;color:#8fa7ca;font-size:12px;line-height:1.8}.main{padding:26px 34px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.top h1{font-size:25px;margin:0}.sub{color:#78869a;font-size:13px;margin-top:6px}.role{display:flex;gap:8px;align-items:center}.pill{padding:9px 13px;border-radius:10px;background:white;border:1px solid #e3e9f1;font-size:13px;font-weight:650}.logout{border:0;background:#e8edf5;border-radius:9px;padding:10px 13px}.hero{background:linear-gradient(110deg,#1b3967,#4c58be);color:white;padding:28px 30px;border-radius:20px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;gap:12px}.hero h2{margin:0 0 7px;font-size:25px}.hero p{margin:0;color:#d9e4ff}.chip{border:1px solid #a6b6f0;background:#ffffff1e;padding:12px;border-radius:12px;font-size:12px;font-weight:750}.grid{display:grid;grid-template-columns:minmax(0,1fr) 325px;gap:22px}.panel{background:white;border:1px solid #e3e9f1;border-radius:18px;padding:22px;box-shadow:0 4px 15px #15233d08}.panel h3{margin:0 0 15px;font-size:18px}.muted{color:#78869a;font-size:13px}.vendorgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin:15px 0 22px}.vendorcard{background:#fff;border:1px solid #e0e6f0;border-radius:13px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:15px;text-align:left;min-height:140px}.vendorcard strong{font-size:15px}.vendorcard small{color:#75859b}.vendorcard.chosen{background:#ecf1ff;border:2px solid #5267df;padding:14px}.meals{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.meal{padding:11px 15px;border:1px solid #e3e9f1;border-radius:12px;background:#f8faff;text-align:left}.meal.active{background:#e9efff;border-color:#5267df;color:#334bc2}.meal strong{display:block}.meal small{display:block;margin-top:4px;color:#7c8ba0}.banner{background:#f1f6ff;border:1px solid #dae5fc;color:#38537d;padding:12px 14px;border-radius:11px;font-size:13px;margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:14px}.food{border:1px solid #e6eaf1;border-radius:14px;overflow:hidden;background:#fff}.food .emoji{height:90px;background:linear-gradient(120deg,#fff5e7,#eaf3ff);display:grid;place-items:center;font-size:46px}.food .inner{padding:13px}.food h4{margin:0 0 6px}.food p{font-size:12px;color:#8190a3;margin:0 0 12px}.food .row,.line{display:flex;justify-content:space-between;align-items:center;gap:10px}.add{background:#4657e9;color:white;border:0;border-radius:9px;padding:7px 13px;font-weight:750}.field{display:block;font-size:12px;font-weight:750;color:#586b83;margin:15px 0 6px}.inp{width:100%;border:1px solid #dfe6ef;padding:12px;border-radius:10px;background:white}.primary{border:0;border-radius:11px;padding:13px 17px;background:#4354e8;color:white;font-weight:800;width:100%;margin-top:16px}.primary.secondary{background:#12345d}.cartline{padding:11px 0;border-bottom:1px solid #edf0f5;font-size:13px}.qty{border:1px solid #dce3ee;background:white;border-radius:7px;padding:3px 9px;margin:0 3px}.total{display:flex;justify-content:space-between;font-size:19px;font-weight:850;margin-top:20px}.notice{background:#e9f8f2;color:#187259;padding:12px;border-radius:10px;font-size:12px;margin-top:13px;line-height:1.6}.token{background:#eaf7ef;border:1px solid #bce9d1;border-radius:15px;padding:19px;margin:16px 0}.token b{font-size:32px;color:#08794d}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.stat{background:white;border:1px solid #e3e9f1;border-radius:14px;padding:20px}.stat b{display:block;font-size:29px;margin-top:8px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}th{color:#78869a;font-size:12px;background:#f6f8fc}th,td{padding:14px 12px;border-bottom:1px solid #e8edf3}td button{border:0;border-radius:8px;padding:8px 10px;background:#e7edff;color:#334db5;font-weight:700}.tag{border-radius:20px;background:#eef2ff;padding:6px 9px;font-size:11px;font-weight:700}.ready{background:#e5f7ed;color:#13724a}.empty{text-align:center;color:#8794a5;padding:38px 10px}.led{background:#081628;color:#fff;border-radius:22px;padding:34px;text-align:center}.led h2{font-size:24px}.lednumber{font-size:clamp(70px,13vw,160px);font-weight:900;color:#54f2b5;line-height:1.2}.lednext{font-size:22px;color:#c3d4f3}.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top left,#253f78,#0e1c31 75%)}.authbox{width:min(100%,490px);background:white;border-radius:24px;padding:34px;box-shadow:0 25px 70px #0003}.authbox h1{margin:0 0 8px;font-size:28px}.rolecards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}.rolecard{border:1px solid #dce4ef;border-radius:13px;background:#f7f9fd;padding:16px 6px;text-align:center;font-weight:750}.rolecard.active{border-color:#4d60e5;background:#e9eeff;color:#3145b3}.rolecard span{display:block;font-size:27px;margin-bottom:7px}.error{color:#b83030;font-size:13px;margin-top:10px}.small{font-size:12px;color:#8a98aa;margin-top:16px;line-height:1.6}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{border:1px solid #dbe3f1;background:white;border-radius:8px;padding:8px}.tools .on{background:#e6edff;border-color:#7589eb}.hide{display:none!important}@media(max-width:950px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.shell{display:block}.side{padding:13px;flex-direction:row;flex-wrap:wrap;align-items:center}.brand{font-size:19px;width:100%;margin:0}.brand small,.foot{display:none}.nav{width:auto;padding:10px;font-size:12px}.main{padding:18px}.hero{padding:22px;display:block}.hero .chip{display:inline-block;margin-top:12px}.top{align-items:start}.top h1{font-size:20px}.stats{grid-template-columns:repeat(2,1fr)}.rolecards{gap:5px}.rolecard{font-size:12px;padding:12px 3px}}
</style></head><body><div id="app"></div>
<script>
(()=>{'use strict';
const KEY='fos-independent-demo-v4';
const sample=[
{id:1,name:'Masala Dosa',desc:'Crispy dosa, sambar & chutney',price:65,emoji:'🥞',meals:['breakfast']},
{id:2,name:'Poha',desc:'Fresh poha with peanuts & lemon',price:35,emoji:'🍋',meals:['breakfast']},
{id:3,name:'Idli Sambar',desc:'Steamed idlis with hot sambar',price:45,emoji:'🍚',meals:['breakfast']},
{id:4,name:'Veg Thali',desc:'Roti, rice, dal, sabzi & salad',price:110,emoji:'🍛',meals:['lunch']},
{id:5,name:'Paneer Rice Bowl',desc:'Paneer curry with jeera rice',price:125,emoji:'🥘',meals:['lunch']},
{id:6,name:'Rajma Chawal',desc:'Rajma curry and steamed rice',price:90,emoji:'🍲',meals:['lunch']},
{id:7,name:'Chapati & Sabzi',desc:'Four chapatis with seasonal sabzi',price:85,emoji:'🫓',meals:['dinner']},
{id:8,name:'Veg Biryani',desc:'Fragrant rice with raita',price:115,emoji:'🍚',meals:['dinner']},
{id:9,name:'Dal Khichdi',desc:'Comforting khichdi with pickle',price:75,emoji:'🥣',meals:['dinner']}
];
const vendors=[{id:'sip-bite',name:'Sip & Bite',category:'Snacks & meals',emoji:'🥪',active:true},{id:'tangy-tadka',name:'Tangy Tadka',category:'Indian meals',emoji:'🍛',active:true},{id:'chai-wala',name:'Chai Wala',category:'Tea & snacks',emoji:'☕',active:true},{id:'amul-icecream',name:'Amul Ice Cream',category:'Desserts',emoji:'🍦',active:true}];
sample.push(
{id:10,name:'Masala Chai',desc:'Freshly brewed spiced tea',price:20,emoji:'☕',meals:['breakfast','lunch','dinner'],vendorId:'chai-wala'},
{id:11,name:'Ginger Tea',desc:'Warm ginger milk tea',price:25,emoji:'🫖',meals:['breakfast','lunch','dinner'],vendorId:'chai-wala'},
{id:12,name:'Veg Sandwich',desc:'Toasted vegetable sandwich',price:55,emoji:'🥪',meals:['breakfast','lunch'],vendorId:'sip-bite'},
{id:13,name:'Samosa',desc:'Crispy potato samosa',price:25,emoji:'🥟',meals:['breakfast','lunch'],vendorId:'sip-bite'},
{id:14,name:'Vanilla Cup',desc:'Creamy vanilla ice cream',price:45,emoji:'🍦',meals:['lunch','dinner'],vendorId:'amul-icecream'},
{id:15,name:'Chocolate Scoop',desc:'Rich chocolate ice cream',price:55,emoji:'🍨',meals:['lunch','dinner'],vendorId:'amul-icecream'});
const slots={breakfast:{label:'Breakfast',time:'07:00–10:30',start:420,end:630},lunch:{label:'Lunch',time:'12:00–15:00',start:720,end:900},dinner:{label:'Dinner',time:'18:00–21:30',start:1080,end:1290}};
const load=()=>{try{const d=JSON.parse(localStorage.getItem(KEY));return d&&Array.isArray(d.orders)&&Array.isArray(d.menu)?d:null}catch{return null}};
let data=load()||{orders:[],menu:sample,next:101,slots:slots,vendors:vendors};data.slots=data.slots||slots;data.vendors=data.vendors||vendors;data.menu.forEach((x,i)=>{if(!x.vendorId)x.vendorId=['sip-bite','chai-wala','tangy-tadka','tangy-tadka','tangy-tadka','tangy-tadka','tangy-tadka','tangy-tadka','tangy-tadka'][i]||'sip-bite'});data.menu.forEach(x=>{if(!Number.isFinite(x.stock))x.stock=20;if(!Number.isFinite(x.lowAt))x.lowAt=5});
let user=null,view='employee',meal='lunch',cart={},error='',lastToken=null,filter='all',preview=false,selectedVendor=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vendorName=id=>data.vendors.find(v=>v.id===id)?.name||'Unknown vendor';
const vendorItems=()=>data.menu.filter(x=>x.vendorId===user?.vendorId);
const vendorOrders=()=>data.orders.filter(x=>x.vendorId===user?.vendorId);
const stockStatus=x=>x.stock<=0?'Out of stock':x.stock<=x.lowAt?'Low stock':'Available';
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN'),save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const now=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const activeMeal=()=>Object.keys(data.slots).find(k=>now()>=data.slots[k].start&&now()<data.slots[k].end);
const allowed=m=>preview||activeMeal()===m;
const stamp=()=>new Date().toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'});
const statusClass=s=>s==='Ready'?'tag ready':'tag';
function render(){if(!user){$('app').innerHTML=loginUI();return} $('app').innerHTML=`<div class="shell"><aside class="side"><div class="brand">🍽️ FOS <small>CAFETERIA WORKSPACE</small></div>${navUI()}<div class="foot">Original independent portfolio prototype<br>Browser-only demo · No real authentication<br>Payment collected at counter</div></aside><main class="main"><div class="top"><div><h1>${view==='employee'?'Employee Ordering':view==='vendor'?'Vendor Food Counter':view==='admin'?'Administration':'LED Token Display'}</h1><div class="sub">FOS · Smart workplace cafeteria</div></div><div class="role"><span class="pill">${esc(user.name)} · ${esc(user.role)}</span><button class="logout" onclick="fos.logout()">Log out</button></div></div>${view==='employee'?employeeUI():view==='vendor'?vendorUI():view==='admin'?adminUI():ledUI()}</main></div>`}
function loginUI(){return `<div class="auth"><div class="authbox"><h1>🍽️ Welcome to FOS</h1><p class="muted">Food Ordering System · Employee Cafeteria</p><h3 style="margin:25px 0 8px">Choose your login</h3><div class="rolecards">${[['employee','👩‍💼','Employee'],['vendor','👨‍🍳','Vendor'],['admin','🛡️','Admin']].map(([r,i,t])=>`<button class="rolecard ${view===r?'active':''}" onclick="fos.role('${r}')"><span>${i}</span>${t}</button>`).join('')}</div><label class="field">Display name</label><input id="loginname" class="inp" placeholder="${view==='employee'?'e.g. Priya Sharma':view==='vendor'?'e.g. Cafeteria Vendor':'e.g. Facility Admin'}"><label class="field">${view==='employee'?'Employee ID':'Demo user ID'}</label>${view==='vendor'?`<select id="loginid" class="inp"><option value="">Select assigned vendor outlet</option>${data.vendors.filter(v=>v.active).map(v=>`<option value="${esc(v.id)}">${esc(v.name)} (${esc(v.id)})</option>`).join('')}</select>`:`<input id="loginid" class="inp" placeholder="${view==='employee'?'EMP1024':'ADM001'}">`}<button class="primary" onclick="fos.login()">Continue to ${view==='employee'?'Employee':view==='vendor'?'Vendor':'Admin'} Dashboard →</button>${error?`<div class="error">${esc(error)}</div>`:''}<div class="small">Demo access: enter any name and ID (vendors select a registered outlet). This is not secure production login. Roles are for showcasing the application workflow.</div></div></div>`}
function navUI(){let opts=user.role==='employee'?[['employee','🍱','Order Food'],['led','📺','Token Display']]:user.role==='vendor'?[['vendor','👨‍🍳','Manage Orders'],['led','📺','LED Display']]:[['admin','📊','Overview & Menu'],['vendor','👨‍🍳','Orders'],['led','📺','LED Display']];return opts.map(([v,i,t])=>`<button class="nav ${view===v?'active':''}" onclick="fos.go('${v}')">${i} &nbsp;${t}</button>`).join('')}
function employeeUI(){let slot=data.slots[meal],available=allowed(meal),items=data.menu.filter(x=>x.vendorId===selectedVendor&&x.meals.includes(meal)&&x.enabled!==false),total=Object.entries(cart).reduce((a,[id,q])=>a+(data.menu.find(x=>x.id===+id)?.price||0)*q,0);return `<section class="hero"><div><h2>Good food, zero waiting in line.</h2><p>Choose your meal · Generate a token · Pay at pickup</p></div><span class="chip">NO ONLINE PAYMENT</span></section><div class="grid"><section class="panel"><h3>${selectedVendor?'Menu · '+esc(vendorName(selectedVendor)):'Choose a Food Outlet'}</h3><div class="vendorgrid">${data.vendors.filter(v=>v.active).map(v=>`<button class="vendorcard ${selectedVendor===v.id?'chosen':''}" onclick="fos.selectVendor('${v.id}')"><span style="font-size:30px">${esc(v.emoji)}</span><strong>${esc(v.name)}</strong><small>${esc(v.category)}</small><small>${data.menu.filter(x=>x.vendorId===v.id&&x.enabled!==false).length} menu items</small></button>`).join('')}</div>${selectedVendor?'':'<div class="banner">Select a vendor to view their food menu and place an order.</div>'}<div class="meals">${selectedVendor?Object.entries(data.slots).map(([k,s])=>`<button class="meal ${meal===k?'active':''}" onclick="fos.meal('${k}')"><strong>${esc(s.label)}</strong><small>${esc(s.time)}</small></button>`).join(''):' '}</div><div class="banner">${activeMeal()?`Current serving window: <b>${esc(data.slots[activeMeal()].label)}</b>.`:'Ordering is currently closed outside scheduled meal hours.'} ${preview?'<b>Demo preview mode is ON.</b>':'Select a meal to view its menu.'} <label style="float:right"><input type="checkbox" ${preview?'checked':''} onchange="fos.preview(this.checked)"> Demo preview</label></div><div class="cards">${selectedVendor?items.map(x=>`<div class="food"><div class="emoji">${esc(x.emoji)}</div><div class="inner"><h4>${esc(x.name)}</h4><p>${esc(x.desc)}</p><p style="font-weight:750;color:${x.stock<=x.lowAt?'#b45309':'#187259'}">${esc(stockStatus(x))} · ${x.stock} left</p><div class="row"><b>${money(x.price)}</b><button class="add" onclick="fos.add(${x.id})" ${available&&x.enabled!==false&&x.stock>(cart[x.id]||0)?'':'disabled'}>+ Add</button></div></div></div>`).join('')||'<div class="empty">No items configured for this meal.</div>':'<div class="empty">Select an outlet above to browse the menu.</div>'}</div></section><aside class="panel"><h3>🛒 Your Order</h3><p class="muted">${selectedVendor?esc(vendorName(selectedVendor)):'Choose an outlet first'}</p>${Object.keys(cart).length?Object.entries(cart).map(([id,q])=>{let x=data.menu.find(y=>y.id===+id);return x?`<div class="cartline"><b>${esc(x.name)}</b><div class="line" style="margin-top:7px"><span>${money(x.price*q)}</span><span><button class="qty" onclick="fos.qty(${x.id},-1)">−</button>${q}<button class="qty" onclick="fos.qty(${x.id},1)">+</button></span></div></div>`:''}).join(''):'<div class="empty">Add something delicious to get started.</div>'}<div class="total"><span>Order total</span><span>${money(total)}</span></div><label class="field">Employee name</label><input class="inp" value="${esc(user.name)}" disabled><label class="field">Employee ID</label><input class="inp" value="${esc(user.id)}" disabled><button class="primary" onclick="fos.place()" ${Object.keys(cart).length&&available&&selectedVendor?'':'disabled'}>Generate Pickup Token →</button><div class="notice">💳 Pay at the cafeteria counter after your token is called. No online payment is collected.</div>${lastToken?`<div class="token"><div>Order placed successfully</div><b>Token #${lastToken}</b><p class="muted">Watch the LED token display for your number.</p></div>`:''}<button class="primary secondary" onclick="fos.go('led')">View LED Token Display</button></aside></div>`}
function stats(){let o=user.role==='vendor'?vendorOrders():data.orders;return [['Total Orders',o.length],['Preparing',o.filter(x=>x.status==='Preparing').length],['Ready to Collect',o.filter(x=>x.status==='Ready').length],['Served',o.filter(x=>x.status==='Served').length]].map(([t,n])=>`<div class="stat"><span class="muted">${t}</span><b>${n}</b></div>`).join('')}
function ordersTable(){let o=[...(user.role==='vendor'?vendorOrders():data.orders)].reverse().filter(x=>filter==='all'||x.status===filter);return `<div class="tools" style="margin-bottom:15px">${['all','Placed','Preparing','Ready','Served'].map(s=>`<button class="${filter===s?'on':''}" onclick="fos.filter('${s}')">${s==='all'?'All Orders':s}</button>`).join('')}</div><div class="tablewrap"><table><thead><tr><th>Token</th><th>Employee</th><th>Outlet</th><th>Meal</th><th>Items</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead><tbody>${o.map(x=>`<tr><td><b>#${x.token}</b><div class="muted">${esc(x.at)}</div></td><td>${esc(x.employee)}<div class="muted">${esc(x.empId)}</div></td><td>${esc(vendorName(x.vendorId))}</td><td>${esc(x.meal)}</td><td>${esc(x.items.map(y=>y.qty+'× '+y.name).join(', '))}</td><td>${money(x.total)}</td><td><span class="${statusClass(x.status)}">${esc(x.status)}</span></td><td>${x.status==='Placed'?`<button onclick="fos.advance(${x.token})">Start preparing</button>`:x.status==='Preparing'?`<button onclick="fos.advance(${x.token})">Mark ready</button>`:x.status==='Ready'?`<button onclick="fos.advance(${x.token})">Paid & served</button>`:'✓ Completed'}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No orders to display. Create a sample order from the Employee Portal.</td></tr>'}</tbody></table></div>`}
function inventoryUI(){let low=vendorItems().filter(x=>x.stock>0&&x.stock<=x.lowAt),out=vendorItems().filter(x=>x.stock<=0);return `<section class="panel" style="margin-bottom:20px"><h3>📦 ${esc(vendorName(user.vendorId))} · Menu & Stock</h3><div class="banner">${low.length?`⚠️ ${low.length} item(s) running low. `:'No low-stock items. '}${out.length?`🔴 ${out.length} item(s) sold out.`:' ' } Stock automatically decreases when employees place orders.</div><div class="tablewrap"><table><thead><tr><th>Item</th><th>Meal</th><th>Price</th><th>Remaining</th><th>Status</th><th>Update stock</th><th>Availability</th></tr></thead><tbody>${vendorItems().map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.meals.join(', '))}</td><td>${money(x.price)}</td><td><b>${x.stock}</b></td><td><span class="${x.stock<=x.lowAt?'tag':'tag ready'}">${stockStatus(x)}</span></td><td><input class="inp" style="width:85px" id="stock-${x.id}" type="number" min="0" value="${x.stock}"><button onclick="fos.stock(${x.id})">Save</button></td><td><button onclick="fos.toggle(${x.id})">${x.enabled===false?'Enable':'Disable'}</button></td></tr>`).join('')}</tbody></table></div><h4>Add a food item</h4><div class="tools"><input class="inp" style="flex:2;min-width:150px" id="newname" placeholder="Food item name"><input class="inp" style="flex:1;min-width:90px" id="newprice" type="number" min="1" placeholder="Price ₹"><input class="inp" style="flex:1;min-width:95px" id="newstock" type="number" min="0" placeholder="Quantity"><input class="inp" style="flex:1;min-width:95px" id="newlow" type="number" min="0" placeholder="Alert at 5"><select class="inp" style="flex:1;min-width:120px" id="newmeal">${Object.keys(data.slots).map(k=>`<option value="${k}">${data.slots[k].label}</option>`).join('')}</select><button class="add" onclick="fos.newItem()">Add Food</button></div></section>`}
function vendorUI(){return `<section class="hero"><div><h2>Food Counter Operations</h2><p>${esc(vendorName(user.vendorId))} · Prepare your orders, call tokens, and confirm counter payment.</p></div><span class="chip">COUNTER STAFF</span></section><div class="stats">${stats()}</div>${inventoryUI()}<section class="panel"><h3>Incoming Orders</h3>${ordersTable()}</section><div class="notice">Workflow: Placed → Preparing → Ready (shown on LED) → Paid & Served. Payment happens physically at the counter.</div>`}
function ledUI(){let ready=data.orders.filter(x=>x.status==='Ready').sort((a,b)=>a.token-b.token);return `<section class="led"><div style="color:#9bb4d8;letter-spacing:3px;font-weight:800">FOS CAFETERIA · PICKUP DISPLAY</div><h2>NOW SERVING</h2><div class="lednumber">${ready[0]?'#'+ready[0].token:'—'}</div><h3>${ready[0]?esc(vendorName(ready[0].vendorId)):'Waiting for orders'}</h3><div class="lednext">Ready for collection: ${ready.map(x=>'#'+x.token+' ('+vendorName(x.vendorId)+')').join('  ·  ')||'Waiting for ready orders'}</div><p style="color:#829abb;margin-top:36px">Please pay at the food counter before collecting your meal.</p></section><div class="panel" style="margin-top:20px"><h3>How it works</h3><p class="muted">Vendor marks an order Ready → its token appears on this display → employee pays and collects → vendor marks Served.</p></div>`}
function adminUI(){let rows=Object.entries(data.slots).map(([k,s])=>`<tr><td><b>${esc(s.label)}</b></td><td><input class="inp" style="width:130px" type="time" id="start-${k}" value="${String(Math.floor(s.start/60)).padStart(2,'0')}:${String(s.start%60).padStart(2,'0')}"></td><td><input class="inp" style="width:130px" type="time" id="end-${k}" value="${String(Math.floor(s.end/60)).padStart(2,'0')}:${String(s.end%60).padStart(2,'0')}"></td><td><button class="add" onclick="fos.slot('${k}')">Save</button></td></tr>`).join('');return `<section class="hero"><div><h2>Cafeteria Administration</h2><p>Manage meal schedules, menus and order activity.</p></div><span class="chip">ADMIN PANEL</span></section><div class="stats">${stats()}</div><section class="panel" style="margin-bottom:20px"><h3>🏬 Vendor Management</h3><p class="muted">Register food outlets. Active outlets automatically appear in the Employee Portal. Each vendor logs in using their assigned Vendor ID.</p><div class="tablewrap"><table><thead><tr><th>Outlet</th><th>Vendor Login ID</th><th>Items</th><th>Orders</th><th>Status</th><th>Action</th></tr></thead><tbody>${data.vendors.map(v=>`<tr><td>${esc(v.emoji)} <b>${esc(v.name)}</b><div class="muted">${esc(v.category)}</div></td><td><code>${esc(v.id)}</code></td><td>${data.menu.filter(x=>x.vendorId===v.id).length}</td><td>${data.orders.filter(x=>x.vendorId===v.id).length}</td><td><span class="${v.active?'tag ready':'tag'}">${v.active?'Active':'Inactive'}</span></td><td><button onclick="fos.vendorToggle('${v.id}')">${v.active?'Deactivate':'Activate'}</button></td></tr>`).join('')}</tbody></table></div><h4>Add a vendor</h4><div class="tools"><input id="vendorname" class="inp" style="flex:2;min-width:150px" placeholder="e.g. South Indian Express"><input id="vendorcategory" class="inp" style="flex:1;min-width:140px" placeholder="e.g. Breakfast & snacks"><button class="add" onclick="fos.addVendor()">+ Add Vendor</button></div></section><section class="panel" style="margin-bottom:20px"><h3>Meal Timings</h3><div class="tablewrap"><table><thead><tr><th>Meal</th><th>Starts</th><th>Ends</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section><section class="panel" style="margin-bottom:20px"><h3>Menu Overview (managed by vendors)</h3><div class="tablewrap"><table><thead><tr><th>Item</th><th>Vendor</th><th>Meal</th><th>Price</th><th>Available</th></tr></thead><tbody>${data.menu.map(x=>`<tr><td>${esc(x.emoji)} ${esc(x.name)}</td><td>${esc(vendorName(x.vendorId))}</td><td>${esc(x.meals.join(', '))}</td><td>${money(x.price)}</td><td>${x.enabled===false?'Hidden':'Visible'}</td></tr>`).join('')}</tbody></table></div><p class="muted">Vendor manages menu items and stock from the Food Counter panel.</p></section><section class="panel"><h3>Order Information</h3>${ordersTable()}</section>`}
window.fos={
role(r){view=r;error='';render()},login(){let n=$('loginname').value.trim(),id=$('loginid').value.trim();if(!n||!id){error='Please enter both name and ID.';render();return}if(view==='vendor'&&!data.vendors.some(v=>v.id===id&&v.active)){error='Select an active registered vendor.';render();return}user={name:n,id,role:view,vendorId:view==='vendor'?id:null};error='';render()},logout(){user=null;view='employee';selectedVendor=null;cart={};lastToken=null;render()},
go(v){if(v==='admin'&&user.role!=='admin')return;if(v==='vendor'&&user.role==='employee')return;view=v;render()},
selectVendor(id){if(!data.vendors.some(v=>v.id===id&&v.active))return;selectedVendor=id;cart={};lastToken=null;render()},
meal(m){meal=m;cart={};lastToken=null;render()},preview(v){preview=v;cart={};render()},
add(id){let x=data.menu.find(x=>x.id===id);if(!x||x.vendorId!==selectedVendor||!x.meals.includes(meal)||!allowed(meal)||x.enabled===false||x.stock<=(cart[id]||0))return;cart[id]=(cart[id]||0)+1;render()},
qty(id,d){if(d>0&&data.menu.find(x=>x.id===id)?.stock<=(cart[id]||0))return;cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];render()},
place(){if(!selectedVendor||!data.vendors.some(v=>v.id===selectedVendor&&v.active)||!Object.keys(cart).length||!allowed(meal))return;if(Object.entries(cart).some(([id,qty])=>data.menu.find(x=>x.id===+id).stock<qty)){alert('One or more items have insufficient stock.');return}let items=Object.entries(cart).map(([id,qty])=>{let x=data.menu.find(x=>x.id===+id);x.stock-=qty;return {name:x.name,price:x.price,qty}});let total=items.reduce((a,x)=>a+x.price*x.qty,0);let token=data.next++;data.orders.push({token,vendorId:selectedVendor,employee:user.name,empId:user.id,meal:data.slots[meal].label,items,total,status:'Placed',at:stamp()});lastToken=token;cart={};save();render()},
advance(token){let x=data.orders.find(x=>x.token===token);if(!x||user.role==='vendor'&&x.vendorId!==user.vendorId||user.role==='employee')return;let map={Placed:'Preparing',Preparing:'Ready',Ready:'Served'};x.status=map[x.status]||x.status;save();render()},
filter(f){filter=f;render()},
addVendor(){if(user.role!=='admin')return;let name=$('vendorname').value.trim(),category=$('vendorcategory').value.trim();if(!name||!category){alert('Enter vendor name and category.');return}let id=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');if(!id||data.vendors.some(v=>v.id===id)){alert('Vendor already exists or name is invalid.');return}data.vendors.push({id,name,category,emoji:'🏪',active:true});save();render()},
vendorToggle(id){if(user.role!=='admin')return;let v=data.vendors.find(v=>v.id===id);if(!v)return;v.active=!v.active;save();render()},
slot(k){let parse=s=>{let [h,m]=s.split(':').map(Number);return h*60+m};let start=parse($('start-'+k).value),end=parse($('end-'+k).value);if(!(end>start)){alert('End time must be later than start time.');return}data.slots[k].start=start;data.slots[k].end=end;data.slots[k].time=$('start-'+k).value+'–'+$('end-'+k).value;save();render()},
toggle(id){let x=data.menu.find(x=>x.id===id);if(!x||user.role!=='vendor'||x.vendorId!==user.vendorId)return;x.enabled=x.enabled===false;save();render()},
stock(id){let x=data.menu.find(x=>x.id===id);if(!x||user.role!=='vendor'||x.vendorId!==user.vendorId)return;let v=Number($('stock-'+id)?.value);if(!Number.isInteger(v)||v<0){alert('Enter a valid non-negative quantity.');return}x.stock=v;save();render()},
newItem(){if(user.role!=='vendor')return;let name=$('newname').value.trim(),price=Number($('newprice').value),m=$('newmeal').value;if(!name||!Number.isFinite(price)||price<=0){alert('Enter a valid name and positive price.');return}data.menu.push({id:Math.max(0,...data.menu.map(x=>x.id))+1,vendorId:user.vendorId,name,price,desc:'Freshly prepared cafeteria meal',emoji:'🍽️',meals:[m],enabled:true,stock:Math.max(0,Number($('newstock')?.value)||0),lowAt:Math.max(0,Number($('newlow')?.value)||5)});save();render()}
};
window.addEventListener('storage',e=>{if(e.key===KEY){let d=load();if(d){data=d;render()}}});
render();
})();
</script></body></html>
